<!DOCTYPE html><html><head><meta charset="utf-8"><style>
:root{--arc:#3fc9ff;--arc-glow:rgba(63,201,255,.55);--gold:#ffc400;--red-dim:#e62429}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e14;font-family:-apple-system,"Segoe UI",sans-serif;color:#cfe;padding:40px}
h2{font-size:15px;letter-spacing:2px;color:#8fa;margin:0 0 6px;text-transform:uppercase}
.note{font-size:12px;color:#6a7a8a;margin-bottom:26px}
.row{display:flex;gap:46px;flex-wrap:wrap;margin-bottom:40px}
.suit{display:flex;flex-direction:column;align-items:center;gap:10px;width:120px}
/* 反应堆圆圈 —— 尺寸/边框/光晕完全照搬线上 46px 规格 */
.reactor{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.reactor.online{background:radial-gradient(circle,rgba(63,201,255,.5),rgba(63,201,255,.05));border:2px solid var(--arc);box-shadow:0 0 20px var(--arc-glow)}
.reactor svg{width:38px;height:38px;display:block}
.lbl{font-size:12px;text-align:center;line-height:1.4}
.lbl b{color:#fff;font-size:13px}
.lbl span{color:#7a8a9a;font-size:10px;display:block}
.sz{font-size:10px;color:#566;margin-top:2px}
/* 对照：放大版看细节 */
.big .reactor{width:96px;height:96px}
.big .reactor svg{width:80px;height:80px}
</style></head><body>

<h2>方案 B — 钢铁侠头盔 · 4 战甲配色</h2>
<p class="note">圆圈 46×46px / 边框 / 光晕 完全照搬线上规格，只把里面的 emoji 换成对应战甲配色的头盔线稿</p>

<div class="row" id="r-small"></div>

<h2 style="margin-top:20px">放大预览（看头盔细节）</h2>
<p class="note">同样的头盔，放大到 96px 方便看清线条与配色（线上实际是上面 46px 那个大小）</p>
<div class="row big" id="r-big"></div>

<script>
// 只取头盔部分的 viewBox（原 SVG 0 0 200 240，头盔在 y≈10~158）
const HELMET = (stroke, eye, fill) => `
<svg viewBox="44 8 112 152" fill="none" stroke="${stroke}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M100 14 C70 14 52 34 52 64 C52 78 54 88 58 96 L60 112 C61 120 64 126 70 130 L78 134 L78 152 L122 152 L122 134 L130 130 C136 126 139 120 140 112 L142 96 C146 88 148 78 148 64 C148 34 130 14 100 14 Z" fill="${fill}"/>
  <path d="M100 14 L100 152"/>
  <path d="M64 56 C78 48 122 48 136 56"/>
  <path d="M58 96 C72 104 84 106 100 106 C116 106 128 104 142 96"/>
  <path d="M70 130 C82 122 90 120 100 120 C110 120 118 122 130 130"/>
  <path d="M70 78 L88 74 L92 84 L74 88 Z" fill="${eye}" stroke="${eye}"/>
  <path d="M130 78 L112 74 L108 84 L126 88 Z" fill="${eye}" stroke="${eye}"/>
  <path d="M88 64 L100 60 L112 64"/>
  <path d="M96 92 L100 110 L104 92"/>
  <path d="M86 124 L114 124 M88 130 L112 130 M91 136 L109 136"/>
</svg>`;

const AGENTS=[
  {name:'钢铁虾',mark:'MARK I',role:'经典红金',stroke:'#e8b923',eye:'#bfe9ff',fill:'rgba(200,40,30,.30)'},
  {name:'MK2',mark:'MARK II',role:'银白裸金属',stroke:'#cfdbe6',eye:'#bfe9ff',fill:'rgba(190,205,220,.18)'},
  {name:'银月',mark:'P.E.P.P.E.R.',role:'玫瑰金/Rescue',stroke:'#e89bb8',eye:'#cfe9ff',fill:'rgba(150,90,160,.26)'},
  {name:'Mark 46',mark:'MARK XLVI',role:'紫金',stroke:'#caa6ff',eye:'#ffe08a',fill:'rgba(120,70,180,.30)'},
];
function render(id){
  document.getElementById(id).innerHTML=AGENTS.map(a=>`
    <div class="suit">
      <div class="reactor online">${HELMET(a.stroke,a.eye,a.fill)}</div>
      <div class="lbl"><b>${a.name}</b><span>${a.mark}</span><span style="color:#8aa">${a.role}</span></div>
    </div>`).join('');
}
render('r-small');render('r-big');
</script>
</body></html>
